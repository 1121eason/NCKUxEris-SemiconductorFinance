<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc">
<title id="title">From semiconductor capability to financial returns</title>
<desc id="desc">Conceptual case framework linking design, wafer fabrication and packaging/testing to customer adoption, margins, cash conversion and invested capital. This is not an internal company process map.</desc>
<rect width="1160" height="500" fill="#f6f8fb"/>
<style>text{font-family:Arial,sans-serif;fill:#142c42} .muted{fill:#526878}</style>
<text x="48" y="55" font-size="28" font-weight="700">From semiconductor capability to financial returns</text>
<text x="48" y="86" font-size="16" class="muted">ERIS historical case | Connecting technical choices, operating conditions and capital discipline</text>
<g fill="#e0edf1" stroke="#bdd6df"><rect x="48" y="125" width="320" height="115" rx="12"/><rect x="420" y="125" width="320" height="115" rx="12"/><rect x="792" y="125" width="320" height="115" rx="12"/></g>
<g font-size="21" font-weight="700"><text x="72" y="160">Design and product fit</text><text x="444" y="160">Wafer fabrication</text><text x="816" y="160">Packaging and testing</text></g>
<g font-size="16"><text x="72" y="191">Power / protection requirements</text><text x="72" y="216">Customer qualification and adoption</text><text x="444" y="191">Yield, process and utilization</text><text x="444" y="216">Own capacity and external supply</text><text x="816" y="191">Reliability, thermal and delivery</text><text x="816" y="216">Quality and production efficiency</text></g>
<g stroke="#236e85" stroke-width="3"><path d="M375 184 H409 M398 174 L409 184 L398 194" fill="none"/><path d="M747 184 H781 M770 174 L781 184 L770 194" fill="none"/><path d="M208 250 V279 M580 250 V279 M952 250 V279" fill="none"/></g>
<rect x="48" y="290" width="1064" height="65" rx="10" fill="#163e52"/>
<text x="580" y="330" text-anchor="middle" style="fill:white" font-size="21">Incremental sales and margins → operating cash flow → returns on invested capital</text>
<rect x="48" y="377" width="1064" height="62" rx="10" fill="#f4e4ce"/>
<text x="72" y="404" font-size="17" font-weight="700">Value depends on execution:</text>
<text x="72" y="427" font-size="16">Qualification delays, idle capacity, equipment spending, inventory and funding can absorb the benefits.</text>
<text x="48" y="475" font-size="13" class="muted">Original analytical framework, 2026. Historical context: ERIS 2023 Annual Report and supplied group analysis.</text>
